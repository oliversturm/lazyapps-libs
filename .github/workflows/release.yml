name: Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for changesets
        id: check
        run: |
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.has_changesets == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_changesets == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.check.outputs.has_changesets == 'true'
        run: pnpm install

      - name: Version packages
        if: steps.check.outputs.has_changesets == 'true'
        run: pnpm run version

      - name: Commit version bumps
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Version Packages"
          git push

      - name: Publish to npm
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          npm install -g npm@latest
          pnpm run release

  snapshot:
    name: Snapshot Release
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#publish-branch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Derive snapshot tag from branch name
        id: tag
        run: |
          TAG="branch-${GITHUB_REF_NAME//\//-}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Publishing snapshot with tag: $TAG"

      - name: Check for changesets
        id: check
        run: |
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No changesets found — nothing to publish"
          fi

      - name: Version packages (snapshot)
        if: steps.check.outputs.has_changesets == 'true'
        run: npx changeset version --snapshot ${{ steps.tag.outputs.tag }}

      - name: Pin internal dependency ranges
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          # After changeset version --snapshot, internal @lazyapps/* deps get
          # ranges like ^X.Y.Z-branch-*. The ^ allows npm to resolve a
          # different branch's snapshot. Strip it so each package pins its
          # exact snapshot version, preventing cross-branch pollution.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const pkgDirs = fs.readdirSync("packages").filter(d =>
              fs.statSync(path.join("packages", d)).isDirectory()
            );
            let totalFixed = 0;
            for (const dir of pkgDirs) {
              const f = path.join("packages", dir, "package.json");
              if (!fs.existsSync(f)) continue;
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              let changed = false;
              for (const depType of ["dependencies", "devDependencies", "peerDependencies"]) {
                if (!pkg[depType]) continue;
                for (const [name, ver] of Object.entries(pkg[depType])) {
                  if (name.startsWith("@lazyapps/") && ver.startsWith("^") && ver.includes("-")) {
                    pkg[depType][name] = ver.slice(1);
                    changed = true;
                    totalFixed++;
                  }
                }
              }
              if (changed) {
                fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + "\n");
              }
            }
            console.log("Pinned " + totalFixed + " internal dependency ranges");
          '

      - name: Publish to npm with branch tag
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          npm install -g npm@latest
          node scripts/copy-license.js
          npx changeset publish --tag ${{ steps.tag.outputs.tag }}

      - name: Summary
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          echo "## Snapshot Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install in demos with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "# In lazyapps-demo:" >> $GITHUB_STEP_SUMMARY
          echo "pnpm use-branch ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
