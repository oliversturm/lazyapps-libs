name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to 22.22.1 — Node 22.22.2 ships a broken bundled npm
          # (missing 'promise-retry' from @npmcli/arborist). Same pin as
          # release.yml. Unpin once Node ships a fixed 22.22.x or 22.23.x.
          node-version: '22.22.1'
          cache: pnpm
      - run: pnpm install
      - run: pnpm format:check
      - run: pnpm test
